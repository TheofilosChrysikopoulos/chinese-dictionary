<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tourist Chinese — 1000 Survival Words</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ============ HOME SCREEN ============ -->
  <main id="home" class="screen">
    <header class="hero">
      <h1>🇨🇳 Tourist Chinese</h1>
      <p>1,000 survival words · English · 汉字 · Pīnyīn</p>
      <p class="hero-hint">Pick a category, then choose <b>Sequential</b> or <b>Random</b> practice.</p>
    </header>

    <section class="grid" id="categoryGrid">
      <!-- Category cards are generated by app.js -->
    </section>

    <section class="whole-dict" id="wholeDictCard">
      <!-- Whole dictionary card is generated by app.js -->
    </section>
  </main>

  <!-- ============ STUDY SCREEN ============ -->
  <main id="study" class="screen hidden">
    <div class="study-top">
      <button id="backBtn" class="btn btn-ghost" title="Back to categories">← Categories</button>
      <div class="study-title" id="studyTitle">Category</div>
      <div class="study-mode" id="studyMode">Mode</div>
    </div>

    <div class="progress-wrap">
      <div class="progress-bar"><div id="progressFill"></div></div>
      <div id="counter" class="counter">1 / 100</div>
    </div>

    <div class="card-stage">
      <div id="flashcard" class="flashcard" role="button" tabindex="0"
           aria-label="Flashcard — click or press Space to flip">
        <div class="card-face card-front">
          <div class="label">English</div>
          <div class="english" id="cardEnglish">hello</div>
          <div class="hint">tap / Space to reveal</div>
        </div>
        <div class="card-face card-back">
          <div class="hanzi" id="cardHanzi">你好</div>
          <div class="pinyin" id="cardPinyin">nǐ hǎo</div>
          <button id="speakBtn" class="btn btn-speak" title="Hear pronunciation">🔊 听</button>
        </div>
      </div>
    </div>

    <div class="controls">
      <button id="prevBtn" class="btn btn-nav" title="Previous (←)">‹ Prev</button>
      <button id="flipBtn" class="btn btn-flip" title="Flip (Space)">Flip</button>
      <button id="nextBtn" class="btn btn-nav" title="Next (→)">Next ›</button>
    </div>

    <div class="done-msg hidden" id="doneMsg">
      🎉 你成功了！You finished this set. Start again?
      <div class="controls">
        <button id="restartBtn" class="btn btn-flip">Practice Again</button>
      </div>
    </div>
  </main>

  <!-- Data files -->
  <script src="data/categories.js"></script>
  <script src="data/cat1.js"></script>
  <script src="data/cat2.js"></script>
  <script src="data/cat3.js"></script>
  <script src="data/cat4.js"></script>
  <script src="data/cat5.js"></script>
  <script src="data/cat6.js"></script>
  <script src="data/cat7.js"></script>
  <script src="data/cat8.js"></script>
  <script src="data/cat9.js"></script>
  <script src="data/cat10.js"></script>
  <!-- App -->
  <script src="app.js"></script>
</body>
</html>
